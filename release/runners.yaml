# Available runners configured by board.cmake.
runners:
- linkserver
- jlink

# Default flash runner if --runner is not given.
flash-runner: linkserver

# Default debug runner if --runner is not given.
debug-runner: linkserver

# Common runner configuration values.
config:
  board_dir: /home/pc-de-titouan/delivery/perso/ambilights-embedded/Ambilights/sdks/frdm_mcxn947_blank_sdk/mcuxsdk/examples/_boards/frdmmcxn947
  # Build outputs:
  bin_file: frdm_mcxn947_ambilights_cm33_core0.bin
  elf_file: frdm_mcxn947_ambilights_cm33_core0.elf
  hex_file: frdm_mcxn947_ambilights_cm33_core0.hex
  # Host tools:
  gdb: /home/pc-de-titouan/delivery/perso/ambilights-embedded/arm-gnu-toolchain-15.3.rel2-x86_64-arm-none-eabi/bin/arm-none-eabi-gdb

# Runner specific arguments
args:
  linkserver:
    - --dt-flash=y
    - --device=MCXN947:FRDM-MCXN947
    - --core=cm33_core0
  jlink:
    - --dt-flash=y
    - --device=MCXN947_M33_0
